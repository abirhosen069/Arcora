name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcora/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: arcora/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arcora-release-apk
          path: arcora/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
